[package]
name = "rsbench"
version = "0.1.0"
edition = "2021"

[features]
# Polyglot transforms are opt-in because their objects are built by Docker-backed
# scripts before Cargo links the shared Rust decoder/writer benchmark harness.
zig = []
nim = []

[dependencies]
png = "0.18.1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
codegen-units = 1
# Whole-program LTO across the png crate boundary and abort-on-panic, so no
# unwind landing pads are emitted around the hot loops. Measured as a separate
# build step from -C target-cpu=native so each is attributable; see RESULTS.
lto = "fat"
panic = "abort"
