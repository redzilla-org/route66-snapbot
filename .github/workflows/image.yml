name: snapbot image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  # The immutable release archive is the anonymous local-Kumo distribution
  # path. GHCR organization packages default private even for public source.
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository's one required gate compiles the real native worker and
      # validates the combined handler from the committed lock files.
      - run: docker build --platform linux/amd64 -f Dockerfile.test -t route66-snapbot:test .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A full commit SHA is immutable consumer identity. No latest tag exists,
      # so route66 cannot silently receive different bytes for the same pin.
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$image" .
          docker push "$image"
          docker save "$image" | gzip -1 > route66-snapbot-linux-amd64.tar.gz
          gh release create "$GITHUB_SHA" route66-snapbot-linux-amd64.tar.gz \
            --target "$GITHUB_SHA" --title "snapbot $GITHUB_SHA" \
            --notes "Immutable Lambda/Kumo image for $GITHUB_SHA."
        env:
          # gh deliberately does not infer the Actions token; make the
          # release publication credential explicit and step-scoped.
          GH_TOKEN: ${{ github.token }}
