# snapbot-ocr -- the in-process OCR engine linked into the snapbot handler.
#
# GENERIC BY CONSTRUCTION: nothing here knows what a "market", a "brand" or a
# "check" is. Every choice -- segmentation mode, upscale, language, budget --
# arrives as a Pass from the caller (GH #4115: the stdio child and its base64
# JSON protocol are deleted; the handler hands this crate the bytes it captured).
[package]
name = "snapbot-ocr"
version = "2.0.0"
edition = "2021"
description = "Resident Tesseract engine linked into route66-snapbot"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
# The Tesseract binding. The model is loaded ONCE per pool process and stays
# resident -- the entire reason this engine exists.
leptess = "0.14"

# The DECODER, not a general image library: png 0.18 + fdeflate is the decoder
# of ../img-scaling-benchmark's overall winner ("Pure Rust KSTREAM, non-PGO").
# src/kstream.rs carries the port.
png = "0.18"
