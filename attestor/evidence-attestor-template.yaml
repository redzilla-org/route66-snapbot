AWSTemplateFormatVersion: "2010-09-09"

# =============================================================================
# Command-center evidence attestor.
#
# WHAT THIS STACK OWNS: one Lambda that signs statements about S3 objects it
# fetched itself (bytes hash, version, headers) plus the DEV CI state it read
# itself, in the existing central report bucket. The bucket stays owned by
# command-center/report-server/test-results-template.yaml; this stack reads
# objects from it and writes <key>.attestation.json sidecars beside them.
#
# WHY NO KMS: owner directive 2026-08-25 rejected KMS cost for this narrow
# signer. The private Ed25519 seed is a wrapped blob in a plain SSM String;
# the unwrap key is a constant in the Lambda source (owner 2026-08-26: "the AWS
# key should be hard-coded (not Lambda env)"), so this template carries NO key
# material and NO NoEcho parameter.
#
# DEV CI TARGETS: the account/region per dev env arrive as ONE JSON parameter,
# derived by deploy.py from route66's env table (owner 2026-08-26: "these
# should be params coming into the lambda") -- no account id is written here.
# =============================================================================

Parameters:
  ImageUri:
    Type: String
    Description: Immutable route66-snapbot amd64 Lambda image URI.

  TestResultsBucketName:
    Type: String
    Description: Existing central report/evidence bucket (versioned).

  PrivateKeyParameterName:
    Type: String
    Description: SSM String parameter holding the wrapped Ed25519 private-key blob.

  DevCiTargetsJson:
    Type: String
    Description: >-
      JSON object {"<env>": {"account": "<12 digits>", "region": "<region>"}} of the
      dev envs whose <env>-ci-orchestrator the attestor may read.

  CiReadRoleName:
    Type: String
    Default: route66-evidence-attestor-ci-read
    Description: Name of the read role deployed in each dev account (dev-ci-read-role-template.yaml).

  OrganizationId:
    Type: String
    AllowedPattern: '^o-[a-z0-9]{10,32}$'
    Description: AWS Organizations id allowed to invoke the signer.

Resources:
  EvidenceAttestorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: evidence-attestor-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Reads the exact object version it was asked to attest (to hash
              # the bytes itself); writes screenshots it captured and the
              # <key>.attestation.json sidecars. It never lists the bucket.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${TestResultsBucketName}/*"
              # ONE parameter, named individually and never as a path wildcard:
              # the wrapped Ed25519 signing seed. Plain SSM String;
              # WithDecryption=false in the handler is deliberate (no
              # SecureString/KMS path).
              #
              # The GitHub read-token parameter that used to sit beside it was
              # REMOVED 2026-09-03 with the attest-code-at-sha action (owner order:
              # "Move the evidence-type:code implementation to a local process
              # (cloud-compose attest)"). The parameter was never created, the
              # action could never run, and the local subcommand reads the same
              # facts out of the operator's git checkout with no token at all.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PrivateKeyParameterName}"
              # The read role has one fixed name in every dev account; the
              # account set is the DevCiTargetsJson parameter, and each dev
              # account's role trust policy is what admits this stack's role.
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:aws:iam::*:role/${CiReadRoleName}"
              # The http:// hops of capture-http-raw (route66#3659). Same-account
              # identity grant, so the fetch function needs no resource policy
              # and nothing else can invoke it.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt HttpFetchFunction.Arn

  EvidenceAttestorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-app"
      # One image owns Chromium, the resident Tesseract workers, and signing.
      # Keeping PackageType explicit prevents a future zip update from silently
      # dropping either native dependency and recreating two runtime paths.
      PackageType: Image
      Role: !GetAtt EvidenceAttestorRole.Arn
      # TIMEOUT 180s, raised from 60 -- GH #3177. The BASELINE for a capture with
      # no interaction at all is 37363 ms (RequestId b2724569, 2026-09-05
      # 01:42:57Z, DMV dev): cold chromium, a networkidle2 load, the full-document
      # lazy-load scroll, the settle wait and a fullPage shot already spend
      # two thirds of the old 60s budget before anything is clicked. One --click
      # then adds up to 5s of waitForSelector, a 400ms settle and up to 8s of
      # navigation wait, and a click that NAVIGATES re-pays the settle and the
      # shot against the new document -- which is why all five --click "#submit"
      # captures on 2026-09-05 ended "Duration: 60000.00 ms, Status: timeout" and
      # produced no evidence whatsoever. 180s is sized for the 8-selector cap
      # this action allows, not for one click, and an unused ceiling costs
      # nothing: Lambda bills duration, never the timeout.
      Timeout: 180
      MemorySize: 1536
      EphemeralStorage:
        Size: 1024
      Architectures: [x86_64]
      Code:
        ImageUri: !Ref ImageUri
      Environment:
        Variables:
          EVIDENCE_ATTESTOR_REGION: !Ref AWS::Region
          EVIDENCE_ATTESTOR_BUCKET: !Ref TestResultsBucketName
          EVIDENCE_ATTESTOR_SSM_PARAM: !Ref PrivateKeyParameterName
          EVIDENCE_ATTESTOR_CI_READ_ROLE_NAME: !Ref CiReadRoleName
          EVIDENCE_ATTESTOR_DEV_CI_JSON: !Ref DevCiTargetsJson
          EVIDENCE_ATTESTOR_HTTP_FETCH_FUNCTION: !Ref HttpFetchFunction

  # ===========================================================================
  # IPv6 FETCH PATH (route66#3659). Owner, verbatim: "#3659: enable the ipv6
  # egress, with no additional costs".
  #
  # WHY A SECOND FUNCTION AND NOT A VPC ON THE SIGNER: the prod rendezvous health
  # origins are AAAA-only plain http on :7080, and a Lambda outside a VPC has
  # IPv4-only egress. A VPC-attached Lambda gets IPv6 through an egress-only
  # internet gateway but LOSES IPv4 internet without a NAT gateway, and the
  # signer needs IPv4: GitHub (no AAAA) for publication, plus STS, SSM and Step
  # Functions. So the signer keeps its networking and only the http:// hop runs
  # here, in fetch-hop.js from the SAME image.
  #
  # WHY THIS STAYS "the attestor should only sign what it retrieves" (owner
  # 2026-08-26): the fetch function lives in this stack, runs this stack's
  # immutable image, and only the signer's role may invoke it. The retrieval is
  # snapbot's own; no caller can hand the signer bytes through this path.
  #
  # ZERO COST AT REST, every resource below: VPC, subnet, route table, route,
  # security group, the Amazon-provided IPv6 /56 and the egress-only internet
  # gateway carry no hourly charge; Lambda's VPC ENIs are free; the function
  # bills per invocation only. There is deliberately NO NAT gateway, NO internet
  # gateway, NO public IPv4, NO interface endpoint and NO provisioned concurrency.
  # Per-GB data transfer out through the egress-only gateway applies to the few
  # KB a /health read moves.
  # ===========================================================================
  HttpFetchVpc:
    Type: AWS::EC2::VPC
    Properties:
      # IPv4 is mandatory for a VPC and unused for egress: no route leaves it.
      CidrBlock: 10.66.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true

  HttpFetchVpcIpv6:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref HttpFetchVpc
      AmazonProvidedIpv6CidrBlock: true

  # One subnet: the function is invoked a few times a day for evidence, so a
  # second AZ buys nothing; an AZ outage fails the capture loudly.
  HttpFetchSubnet:
    Type: AWS::EC2::Subnet
    DependsOn: HttpFetchVpcIpv6
    Properties:
      VpcId: !Ref HttpFetchVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.66.0.0/26
      Ipv6CidrBlock: !Select [0, !Cidr [!Select [0, !GetAtt HttpFetchVpc.Ipv6CidrBlocks], 1, 64]]
      MapPublicIpOnLaunch: false

  HttpFetchEgressOnlyGateway:
    Type: AWS::EC2::EgressOnlyInternetGateway
    Properties:
      VpcId: !Ref HttpFetchVpc

  HttpFetchRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HttpFetchVpc

  # The ONLY route out: IPv6 through the egress-only gateway. No 0.0.0.0/0.
  HttpFetchIpv6DefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref HttpFetchRouteTable
      DestinationIpv6CidrBlock: "::/0"
      EgressOnlyInternetGatewayId: !Ref HttpFetchEgressOnlyGateway

  HttpFetchSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref HttpFetchSubnet
      RouteTableId: !Ref HttpFetchRouteTable

  # Declaring egress replaces the default allow-all IPv4 rule, so the function
  # can open only these IPv6 ports. DNS to the VPC resolver is not SG-filtered.
  HttpFetchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: snapbot IPv6 fetch hop, outbound http 80/443/7080 over IPv6 only
      VpcId: !Ref HttpFetchVpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 7080, ToPort: 7080, CidrIpv6: "::/0" }

  # Needs nothing but its logs and the ENI lifecycle the managed policy grants.
  HttpFetchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  # Declared so the group carries a retention; an auto-created Lambda log
  # group has none.
  HttpFetchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-http-fetch"
      RetentionInDays: 30

  HttpFetchFunction:
    Type: AWS::Lambda::Function
    DependsOn: [HttpFetchLogGroup, HttpFetchSubnetRoutes, HttpFetchIpv6DefaultRoute]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-http-fetch"
      PackageType: Image
      Role: !GetAtt HttpFetchRole.Arn
      # The caller's socket timeout is capped at 30s; the rest covers cold start.
      Timeout: 45
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["fetch-hop.handler"]
      VpcConfig:
        Ipv6AllowedForDualStack: true
        SubnetIds: [!Ref HttpFetchSubnet]
        SecurityGroupIds: [!Ref HttpFetchSecurityGroup]

  # WHY THIS ALARM EXISTS: this one function signs EVERY piece of closure
  # evidence in the system, and it has no DLQ and no failure destination -- a
  # failed invocation leaves nothing behind but a log line nobody is reading.
  # Its failure mode is therefore SILENCE, and evidence that was never captured
  # is indistinguishable from evidence nobody requested: a ticket simply sits
  # unclosed and the reason is invisible. A single error over five minutes is
  # worth surfacing because invocations are rare and deliberate, so there is no
  # background error rate to tune out.
  #
  # No AlarmActions: this account has no SNS topic, and inventing one here would
  # be infrastructure nobody asked for. The alarm's value is that its state is
  # queryable and visible in the console; matching the two compactor alarms added
  # 2026-09-03, which are actionless for the same reason.
  #
  # TreatMissingData notBreaching: this function is invoked only when evidence is
  # requested, so most periods have no datapoints at all, and any other setting
  # would leave the alarm permanently in INSUFFICIENT_DATA or ALARM.
  EvidenceAttestorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-errors"
      AlarmDescription: >-
        The evidence attestor Lambda reported one or more errors. It signs all
        ticket closure evidence and has no DLQ, so a failure is otherwise silent.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EvidenceAttestorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EvidenceAttestorInvokeFromOrg:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EvidenceAttestorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: "*"
      PrincipalOrgID: !Ref OrganizationId

Outputs:
  EvidenceAttestorFunctionName:
    Value: !Ref EvidenceAttestorFunction
  EvidenceAttestorFunctionArn:
    Value: !GetAtt EvidenceAttestorFunction.Arn
